[package]
name = "rustmusic"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "rustmusic"
path = "main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
gdk-pixbuf = "0.21"
fastrand = "2"
encoding_rs = "0.8"
lofty = "0.22"
ksni = { version = "0.3", features = ["blocking"] }
rodio = { version = "0.21", default-features = false, features = [
    "playback",
    "symphonia-all",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
